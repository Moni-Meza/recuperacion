<body>

    <header>
        <h1>AutoRent S.A.S.</h1>

                <li><a href="vehiculos.html">Vehículos</a></li>

                <li><a href="contacto.html" class="activo">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <section class="contacto-contenido">
        <div class="formulario">
            <h2>Contáctanos</h2>

            <form>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" required>

                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" rows="4"></textarea>

                <button type="submit">Enviar mensaje</button>
            </form>
        </div>
    </section>

    <section class="info-contacto">
        <h3>Información de contacto</h3>
        <p><strong>Teléfono:</strong> +57 320 456 7890</p>
        <p><strong>Correo:</strong> contacto@autorent.com</p>
        <p><strong>Dirección:</strong> Calle 45 # 22 - 10, Bogotá, Colombia</p>
        <p>
            <strong>Redes sociales:</strong><br>
            <a href="#">Facebook</a> | 
            <a href="#">Instagram</a> | 
            <a href="#">Twitter</a>
        </p>
    </section>
